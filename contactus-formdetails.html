<div
  style="
    max-width: 780px;
    margin: 24px auto;
    padding: 0;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    font-family: Georgia, serif;
    color: #222;
  "
>
  <!-- Logo -->
  <div
    style="
      padding: 18px 20px 0;
      text-align: center;
      border-bottom: 1px solid #eee;
    "
  >
    <img
      src="assets/img/consulting/consulting-logo.png"
      alt="Dignity Medical Training"
      style="max-height: 48px; height: auto; width: auto; display: inline-block"
    />
  </div>

  <!-- Header row -->
  <div
    style="
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid #eee;
    "
  >
    <h3 style="margin: 0; font-size: 20px; font-weight: 700">
      Contact Us Form Details
    </h3>
  </div>

    <div
      style="
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 0;
        border-bottom: 1px solid #f1f1f1;
      "
    >
      <div
        style="
          width: 200px;
          min-width: 180px;
          display: flex;
          align-items: center;
          gap: 8px;
        "
      >
        <input
          type="checkbox"
          checked
          style="width: 16px; height: 16px; margin: 0; accent-color: #1c2d59"
        />
        <label style="margin: 0; font-weight: 600">Name</label>
      </div>
      <div style="flex: 1">
        <input
          type="text"
          placeholder="Name*"
          style="
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: Georgia, serif;
            font-size: 14px;
            outline: none;
          "
        />
      </div>
    </div>

    <!-- Email -->
    <div
      style="

        align-items: center;
        gap: 16px;

        gap: 16px;
        padding: 10px 0;
        border-bottom: 1px solid #f1f1f1;
      "

      <div
        style="
          width: 200px;
          min-width: 180px;

          align-items: center;
          gap: 8px;
        "

        <span style="font-weight: 600">Message</span>

      <div style="flex: 1">
        <textarea

            border: 1px solid #ddd;
            border-radius: 4px;
